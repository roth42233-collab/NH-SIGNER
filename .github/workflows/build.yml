name: Build NH-Signer IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NH-Signer iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          else
            echo "Using default Xcode:"
          fi
          xcodebuild -version

      - name: Build IPA via Makefile
        run: |
          make

      - name: Upload NH-Signer IPA
        uses: actions/upload-artifact@v4
        with:
          name: NH-Signer-IPA
          path: packages/NH-Signer.ipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: NH-Signer v1.0.0
          tag_name: v1.0.0
          files: packages/NH-Signer.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
