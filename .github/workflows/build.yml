name: Build NH-Signer iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15 / 16
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build and Archive NH-Signer
        run: |
          xcodebuild \
            -project NH-Signer.xcodeproj \
            -scheme NH-Signer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NH-Signer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/NH-Signer.xcarchive/Products/Applications/NH-Signer.app Payload/
          zip -r NH-Signer.ipa Payload
          ls -la NH-Signer.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NH-Signer-IPA
          path: NH-Signer.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "NH-Signer iOS v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ## NH-Signer iOS Sideloading App
            - Pure native Swift implementation
            - Zero external dependencies
            - Local OTA itms-services installation server
            - P12 & Mobileprovision certificate manager
            - Custom app bundle ID, display name, and versioning
          files: NH-Signer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
