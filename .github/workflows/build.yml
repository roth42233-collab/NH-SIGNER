name: Build NH-Signer IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NH-Signer iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || \
          sudo xcode-select -s /Applications/Xcode_16.2.app || \
          sudo xcode-select -s /Applications/Xcode_16.app || \
          sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -resolvePackageDependencies || true

      - name: Build IPA via Makefile
        run: |
          make

      - name: Upload NH-Signer IPA
        uses: actions/upload-artifact@v4
        with:
          name: NH-Signer-IPA
          path: packages/NH-Signer.ipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          gh release create "v1.0.0-${{ github.run_number }}" packages/NH-Signer.ipa \
            --title "NH-Signer v1.0.0 (Build ${{ github.run_number }})" \
            --notes "Full Feather-based on-device sideloading and signing application" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
