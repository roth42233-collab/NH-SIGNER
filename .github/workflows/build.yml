name: Build NH-Signer IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NH-Signer iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          for app in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              if xcodebuild -showsdks | grep -i "iphoneos" >/dev/null 2>&1; then
                echo "Successfully selected $app with iOS SDK:"
                xcodebuild -showsdks
                break
              fi
            fi
          done
          xcodebuild -version

      - name: Cache Swift PM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -workspace Feather.xcworkspace -scheme Feather -resolvePackageDependencies

      - name: Build IPA via Makefile
        run: |
          make

      - name: Upload NH-Signer IPA
        uses: actions/upload-artifact@v4
        with:
          name: NH-Signer-IPA
          path: packages/NH-Signer.ipa
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/heads/main')
        run: |
          gh release create "v1.0.0-${{ github.run_number }}" packages/NH-Signer.ipa \
            --title "NH-Signer v1.0.0 (Build ${{ github.run_number }})" \
            --notes "Full Feather-based on-device sideloading and signing application" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
